name: Validate builder composition schema

on:
  pull_request:
    paths:
      - "src/BuilderApp.tsx"
      - "src/composition/**"
      - "src/components/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/validate-composition.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build design system and type-check
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
